[project]
name = "atlas"
version = "0.1.0"
description = "Visor de estrés térmico (UTCI/ERA5-HEAT) para México, estilo Thermal Trace"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dask>=2026.6.0",
    "faicons>=0.2.2",
    "geopandas>=1.1.4",
    "geopy>=2.4.1",
    "ipyleaflet>=0.20.0",
    "jupyter>=1.1.1",
    "jupytext>=1.19.5",
    "mapclassify>=2.11.0",
    "matplotlib>=3.11.0",
    "netcdf4>=1.7.4",
    "notebook>=7.6.2",
    "numpy>=2.5.0",
    "pandas>=3.0.3",
    "pyarrow>=25.0.1",
    "pyogrio>=0.13.0",
    "pystac>=1.15.2",
    "rioxarray>=0.23.0",
    "shapely>=2.1.2",
    "shiny>=1.6.3",
    "shinywidgets>=0.8.1",
    "xarray>=2026.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
]
